openapi: 3.0.3
info:
  title: CEMA Auth Service API
  description: Microserviço de autenticação do Sistema CEMA.
  version: 1.0.0
  contact:
    name: CEMA Team

servers:
  - url: http://localhost:3001
    description: Auth Service

tags:
  - name: Authentication
    description: Endpoints de autenticação
  - name: Health
    description: Verificação de status

paths:
  /auth/login:
    post:
      summary: Login para obter token JWT
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
            example:
              username: admin
              password: admin123
      responses:
        '200':
          description: Token JWT gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: bearer
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/validate:
    get:
      summary: Validar token JWT
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  user:
                    type: string
                    example: admin
                  exp:
                    type: integer
                    example: 1702789200
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  detail:
                    type: string
                    example: Token expired

  /auth/health:
    get:
      summary: Health check do Auth Service
      tags:
        - Health
      responses:
        '200':
          description: Auth Service funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: auth-service

components:
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
          example: Error message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtido via POST /auth/login.
